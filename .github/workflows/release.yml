name: Release VSIX

# 发布 .vsix:
#   1) 推 v* 标签 (推荐): git tag v1.3.0 && git push origin v1.3.0
#   2) 手动触发 (Actions -> Release VSIX -> Run workflow), 可指定版本号
#
# 产出:
#   - GitHub Release: 附带 magic-tools-<version>.vsix (+ .sha256) 与自动生成的变更说明
#   - Actions 产物: vsix 文件 (保留 30 天)
#   - 若配置了 VSCE_PAT 密钥, 同时发布到 VS Code Marketplace
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (留空则用 package.json 中的版本; 形如 1.3.0)'
        required: false
        type: string
      prerelease:
        description: '标记为预发布 (Pre-release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 打包并发布
    runs-on: ubuntu-latest
    env:
      # 放到 job 级 env, 才能被步骤的 if 条件读到 (step 级 env 在 if 里不可见)
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验代码
        run: |
          npm run typecheck
          npm test

      - name: 确定版本号
        id: meta
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
            # 只改 package.json, 不碰 git (npm version 会校验工作区是否干净)
            npm pkg set "version=${VERSION}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          # v* 标签与 package.json 版本必须一致, 避免产出的文件名对不上
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "${TAG_VERSION}" != "${VERSION}" ]; then
              echo "::error::标签 ${GITHUB_REF_NAME} 与 package.json 版本 ${VERSION} 不一致"
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vsix=magic-tools-${VERSION}.vsix" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本: ${VERSION}"

      - name: 构建并打包 VSIX
        run: |
          set -euo pipefail
          npm run build
          npm run package -- --out "${{ steps.meta.outputs.vsix }}"
          sha256sum "${{ steps.meta.outputs.vsix }}" > "${{ steps.meta.outputs.vsix }}.sha256"
          ls -lh "${{ steps.meta.outputs.vsix }}"

      - name: 上传 VSIX 为 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: magic-tools-vsix-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.meta.outputs.vsix }}
            ${{ steps.meta.outputs.vsix }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 创建 GitHub Release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          VSIX: ${{ steps.meta.outputs.vsix }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          {
            echo "## Magic Tools for VS Code v${VERSION}"
            echo
            echo "**安装**"
            echo
            echo '```bash'
            echo "code --install-extension ${VSIX}"
            echo '```'
            echo
            echo "也可以下载下方 .vsix 后, 在 VS Code 里用「扩展 … → 从 VSIX 安装…」导入。"
            echo
            echo "**校验**"
            echo
            echo '```'
            cat "${VSIX}.sha256"
            echo '```'
            echo
            echo "官网: https://freewu.github.io/magic-tools-vscode/"
          } > "${notes_file}"

          prerelease_flag=()
          if [ "${PRERELEASE}" = "true" ] || [[ "${VERSION}" == *-* ]]; then
            prerelease_flag+=(--prerelease)
          fi

          # 已存在的 Release 则覆盖产物, 否则新建 (手动触发重跑时不会报错)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${VSIX}" "${VSIX}.sha256" --clobber
            gh release edit "${TAG}" --title "v${VERSION}" --notes-file "${notes_file}" "${prerelease_flag[@]}"
          else
            gh release create "${TAG}" "${VSIX}" "${VSIX}.sha256" \
              --title "v${VERSION}" \
              --notes-file "${notes_file}" \
              "${prerelease_flag[@]}"
          fi

      - name: 发布到 VS Code Marketplace (可选)
        # 需要仓库密钥 VSCE_PAT (Azure DevOps Personal Access Token, Marketplace 权限)
        if: env.VSCE_PAT != ''
        env:
          VSIX: ${{ steps.meta.outputs.vsix }}
        run: |
          set -euo pipefail
          npm run publish -- --packagePath "${VSIX}"

      - name: 汇总
        run: |
          {
            echo "### 发布完成"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${{ steps.meta.outputs.version }}\` |"
            echo "| 产物 | \`${{ steps.meta.outputs.vsix }}\` |"
            echo "| Release | \`${{ steps.meta.outputs.tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
