name: CI

# 提交 / PR 到 main 时: 类型检查 + 冒烟测试 (119 个工具页面各渲染一遍) + 构建
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 / 测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 冒烟测试 (jsdom 渲染全部工具)
        run: npm test

      - name: 构建 (WebView + 宿主)
        run: npm run build

      - name: 官网冒烟测试 (工具清单与源码一致)
        run: npm run docs:test
